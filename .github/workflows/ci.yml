name: CI
on:
  pull_request:
  push:
    branches: [main, "claude/**"]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit + database (RLS) tests
        run: npm test
      - name: Production build (no Supabase keys = local-only mode)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
      - name: Seed SQL is up to date with the TypeScript library
        run: |
          npm run gen:seed
          git diff --exit-code supabase/migrations/0004_seed_reference.sql

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  secrets-scan:
    name: No committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Scan for obvious secrets
        run: |
          if git grep -InE "(service_role|SUPABASE_SERVICE_ROLE_KEY|CRON_SECRET|VAPID_PRIVATE_KEY)[\"']?\s*[:=]\s*[\"']?[A-Za-z0-9._-]{20,}" -- . ':!.env.example' ':!docs' ':!*.md' ':!.github'; then
            echo "Possible secret committed"; exit 1; fi
          if git ls-files | grep -E "(^|/)\.env(\.|$)" | grep -v "\.env\.example$"; then echo ".env file committed"; exit 1; fi
