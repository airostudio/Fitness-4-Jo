name: Supabase migrate (manual)
# Applies supabase/migrations to a Supabase project. NEVER runs automatically.
# Protect it: in GitHub → Settings → Environments → "production" → add required reviewers.
# Secrets (on that environment): SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD
on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: "Supabase project ref (e.g. gjryjzffjlirstzpgnnn)"
        required: true
      mode:
        description: "dry-run only shows what would change"
        type: choice
        options: [dry-run, apply]
        default: dry-run
      backup_confirmed:
        description: "I confirmed a backup / PITR restore point exists (type YES to apply)"
        required: false
permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Link project
        run: supabase link --project-ref "${{ inputs.project_ref }}" --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Show pending migrations (dry run)
        run: supabase db push --dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Apply migrations
        if: ${{ inputs.mode == 'apply' && inputs.backup_confirmed == 'YES' }}
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Reminder
        run: echo "Now run supabase/verify.sql in the SQL editor – no PROBLEM rows means the deployment is sound."
